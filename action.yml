name: "Variables Allocation"
description: "Replace placeholders on an .env template file to a functional env file ready to use on production"
inputs:
  ENV_FILES:
    description: 'JSON array of [input, output] file path pairs, e.g. [["./.env.prod", "./.env"], ["./.npmrc.template", "./.npmrc"]]. Each pair is processed sequentially.'
    required: true
  REPO_VARS:
    description: "Environment variables allocated on current repo"
    required: true
  REPO_SECRETS:
    description: "Environment secrets allocated on current repo"
    required: true
  CLOUDFRONT:
    description: "Enable resolving CLOUDFRONT_DIST_ID from vars/secrets"
    required: false
    default: "false"
outputs:
  CLOUDFRONT_DIST_ID:
    description: "Resolved CloudFront distribution ID from vars or secrets"
    value: ${{ steps.entrypoint.outputs.CLOUDFRONT_DIST_ID }}
runs:
  using: "composite"
  steps:
    - id: entrypoint
      shell: bash
      run: |
        chmod +x ${{ github.action_path }}/entrypoint.sh
        ${{ github.action_path }}/entrypoint.sh
      env:
        ENV_FILES: ${{ inputs.ENV_FILES }}
        REPO_VARS: ${{ inputs.REPO_VARS}}
        REPO_SECRETS: ${{ inputs.REPO_SECRETS}}
        CLOUDFRONT: ${{ inputs.CLOUDFRONT }}
